spring:
  application:
    name: order-service

  # ?? DATABASE ????????????????????????????????????????????????????
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: nanda
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      pool-name: OrderServicePool

  # ?? JPA ?????????????????????????????????????????????????????????
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ?? REDIS ????????????????????????????????????????????????????????
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      repositories:
        enabled: false

  # ?? KAFKA ????????????????????????????????????????????????????????
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  # ?? FLYWAY ??????????????????????????????????????????????????????
  flyway:
    enabled: false

# ?? SERVER ??????????????????????????????????????????????????????
server:
  port: 8083

# ?? EUREKA ??????????????????????????????????????????????????????
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ?? APP CUSTOM ??????????????????????????????????????????????????
app:
  base-url: http://localhost:8083
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  cookie:
    access-token-name: access_token    # ← ADD
    refresh-token-name: refresh_token  # ← ADD
    secure: false
    same-site: Strict
    path: /

# ?? SWAGGER ?????????????????????????????????????????????????????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.ecommerce.order_service.controller

# ?? LOGGING ?????????????????????????????????????????????????????
logging:
  level:
    com.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/order-service.log